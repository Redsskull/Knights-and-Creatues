[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --color=yes
    --strict-markers
    -x
markers =
    unit: Unit tests
    integration: Integration tests
    ui: UI component tests
    slow: Slow running tests
filterwarnings =
    ignore::pygame.error
    ignore::UserWarning
